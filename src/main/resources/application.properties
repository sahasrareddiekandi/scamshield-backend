spring.application.name=scamshield-backend
server.port=8081

# Database Configuration (MySQL as primary, with resilient fallback to H2 if MySQL is unavailable)
scamshield.datasource.preferred=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scamshield?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sahasrareddy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Configuration (Graceful degradation if Redis server is down)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1500ms
scamshield.redis.enabled=${REDIS_ENABLED:true}

# JWT Security
scamshield.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
scamshield.jwt.expiration-ms=86400000

# Google Gemini AI Studio Integration
scamshield.gemini.api-key=${GEMINI_API_KEY:}
scamshield.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
scamshield.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models
scamshield.gemini.timeout-ms=8000

# Rate Limiting
scamshield.ratelimit.requests-per-minute=30

# CORS Configuration
scamshield.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.scamshield=INFO
logging.level.org.springframework.security=WARN
